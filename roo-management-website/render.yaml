# Render.com Blueprint for Roo Management Inc.
# A static site — Render serves the files directly, no build needed.
# Docs: https://render.com/docs/static-sites
services:
  - type: web
    name: roo-management-website
    runtime: static
    # Repo root is the parent; the site lives in this subfolder.
    rootDir: roo-management-website
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
    routes:
      # SPA-style fallback not needed (single page), but keep 404 for bad paths.
      - type: rewrite
        source: /home
        destination: /index.html
