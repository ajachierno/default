<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found · Roo Management Inc.</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --teal:#0f3d3e; --gold:#d9a441; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
      font-family:"Inter",system-ui,sans-serif; color:#eaf3f0; padding:24px;
      background:linear-gradient(160deg,#0f3d3e,#0b2e2f); }
    h1 { font-family:"Fraunces",Georgia,serif; font-size:clamp(2.4rem,7vw,4rem); margin:.2em 0; color:#fff; }
    .code { font-family:"Fraunces",Georgia,serif; font-size:clamp(4rem,16vw,8rem); color:var(--gold); line-height:1; }
    p { color:#cfe0dc; max-width:44ch; margin:0 auto 2em; }
    a { display:inline-block; background:var(--gold); color:#201803; font-weight:700; text-decoration:none;
      padding:15px 28px; border-radius:999px; }
    a:hover { background:#e6b95c; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for has moved or doesn't exist. Let's get you back home.</p>
    <a href="/">Return to Roo Management</a>
  </main>
</body>
</html>
