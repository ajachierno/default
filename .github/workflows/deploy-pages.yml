name: Deploy Roo Management website

# Publishes the static site in roo-management-website/ to GitHub Pages.
# Only runs when that folder (or this workflow) changes, so it never
# interferes with the rest of the repository.

on:
  push:
    branches: [master]
    paths:
      - "roo-management-website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

# Permissions the deploy needs
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable GitHub Pages (Actions source) if it isn't already,
          # so no manual Settings toggle is required.
          enablement: true

      - name: Upload site artifact (only the website subfolder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: roo-management-website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
